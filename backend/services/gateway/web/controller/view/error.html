<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>ONLYOFFICE for Pipedrive</title>
    <link rel="icon" type="image/svg+xml" href="{{.Favicon}}" />
    <style>
      :root {
        --bg: #ffffff;
        --text: #333333;
        --subtext: #a3a9ae;
        --border: #d0d5da;
        --accent: #ff6f3d;
        --accent-text: #ffffff;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #333333;
          --text: #ffffff;
          --subtext: #858585;
          --border: #474747;
        }
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;

        margin: 0;
        padding: 16px;

        background: var(--bg);
        color: var(--text);
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          "Helvetica Neue",
          sans-serif;
        line-height: 1.5;
        text-align: center;
      }

      .logo {
        color: var(--text);
      }

      .logo svg {
        height: auto;
        width: 131px;
        max-width: 100%;
        display: block;
      }

      .illustration {
        margin-top: 1.25rem;
      }

      .illustration svg {
        height: auto;
        width: 200px;
        max-width: 100%;
        display: block;
      }

      .error {
        max-width: 18rem;
        display: flex;
        flex-direction: column;
        align-items: center;

        margin-top: 2.5rem;
      }

      h1 {
        margin: 0 0 0.5rem;

        font-size: 1.25rem;
        line-height: 1.75rem;
        font-weight: 700;
      }

      p {
        margin: 0;

        font-size: 0.75rem;
        line-height: 1rem;

        color: var(--subtext);
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;

        margin-top: 1.5rem;
        gap: 0.5rem;
      }

      .button {
        display: inline-block;

        padding: 0.5rem 1.25rem;

        border-radius: 3px;
        border: 1px solid var(--border);

        font-size: 13px;
        font-weight: 600;
        text-decoration: none;

        color: var(--text);
      }

      .button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-text);
      }

      .button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <div class="logo" role="img" aria-label="ONLYOFFICE">{{.Logo}}</div>
    <div class="illustration" aria-hidden="true">{{.Icon}}</div>
    <main class="error">
      <h1>{{.Title}}</h1>
      <p>{{.Message}}</p>
      <div class="actions">
        {{if .RetryURL}}<a class="button primary" href="{{.RetryURL}}"
          >Try again</a
        >{{end}}
        <a
          class="button{{if not .RetryURL}} primary{{end}}"
          href="https://app.pipedrive.com"
          >Back to Pipedrive</a
        >
      </div>
    </main>
  </body>
</html>
